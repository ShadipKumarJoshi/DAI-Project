{% if pop_up_notices %}
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>

{{ pop_up_notices|json_script:"popup-data" }}

<div x-data="{
      current: 0,
      open: true,
      notices: [],
      init() {
        this.notices = JSON.parse(document.getElementById('popup-data').textContent);
      }
    }"
    x-show="notices.length > 0 && open"
    class="fixed inset-0 z-[9999]" aria-modal="true">

  <div class="fixed inset-0 bg-gray-500/75" aria-hidden="true"></div>

  <div class="w-screen overflow-y-auto">
    <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
      <template x-if="notices[current]">
        <div x-show="open"
             x-transition
             class="relative transform rounded-lg bg-white text-left shadow-xl sm:my-8 sm:w-full sm:max-w-xl max-h-[90vh] overflow-y-auto">
          <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
            <div class="sm:flex sm:items-start">
              <div class="mx-auto flex size-12 shrink-0 items-center justify-center rounded-full bg-blue-100 sm:mx-0 sm:size-10">
                <svg class="size-6 text-blue-600" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 9v3m0 4h.01m-6.938 4h13.856c1.054 0 1.918-.816
                         1.994-1.85L21 18V6a2 2 0 00-1.85-1.995L19
                         4H5a2 2 0 00-1.995 1.85L3 6v12c0
                         1.054.816 1.918 1.85 1.994L5 20z"/>
                </svg>
              </div>
              <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left">
                <h3 class="text-lg font-medium text-gray-900" x-text="notices[current].title"></h3>
                <div class="mt-2">
                  <template x-if="notices[current].image">
                    <img :src="notices[current].image" alt="Notice Image" class="rounded-md mb-3">
                  </template>
                  <p class="text-sm text-gray-600" x-text="notices[current].content"></p>
                  <a :href="`/notice/${notices[current].id}/`"
                     class="text-blue-600 hover:underline text-sm block mt-2">Read more →</a>
                </div>
              </div>
            </div>
          </div>
          <div class="bg-gray-50 px-4 py-3 sm:flex sm:flex-row-reverse sm:px-6">
            <button @click="
              if (current < notices.length - 1) {
                current++;
              } else {
                open = false;
              }"
              class="inline-flex w-full justify-center rounded-md bg-blue-600 px-4 py-2 text-sm font-semibold text-white hover:bg-blue-500 sm:ml-3 sm:w-auto">
              Close
            </button>
          </div>
        </div>
      </template>
    </div>
  </div>
</div>
{% endif %}
