{% load static %}
<!-- base.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% block title %}
        Digital Portal
      {% endblock %}
    </title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />

    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  </head>
  <body class="bg-gray-100 font-sans text-gray-800 min-h-screen flex items-center justify-center px-4 py-12">
    <!-- Card container -->
    <div class="bg-white rounded-2xl shadow-xl border border-gray-200 w-full max-w-5xl p-8">
      <!-- Header -->
      <div class="flex items-center gap-5 mb-8">
        <img src="{% static 'core/images/logos/dai_logo.png' %}" alt="DAI Logo" class="h-12" />
        <img src="{% static 'core/images/logos/Emblem_of_Nepal.png' %}" alt="Partner Logo" class="h-12" />
      </div>

      <!-- Dynamic Page Content -->
      {% block content %}

      {% endblock %}

      <!-- Footer -->
      <!-- Footer -->
      <div class="mt-8 flex items-center justify-between text-sm text-gray-500">
        <div class="flex items-center gap-2">
          <img src="{% static 'core/images/icons/us_flag.png' %}" alt="US Flag" class="h-4 w-auto rounded-sm shadow-sm" />
          <span>English (US)</span>
        </div>
        <p>© 2025 Udyog Project — Ministry of Economic Affairs, Koshi Province</p>
      </div>
    </div>
  </body>
</html>
